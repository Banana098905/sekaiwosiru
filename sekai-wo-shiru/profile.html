<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界を知る — プロフィール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Serif JP', 'Georgia', serif; background: #1a1510; color: #d4bc8a; min-height: 100vh; }
    
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #1e140a;
      border-bottom: 1px solid rgba(180,140,70,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      z-index: 100;
    }
    .nav-link {
      color: rgba(180,140,70,0.45);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.15em;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: #d4a855; }
    
    .profile-bg {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      transition: background 0.3s;
    }
    
    .profile-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 30px;
    }
    
    /* プロフィールカード */
    .profile-card {
      background: rgba(30,21,10,0.6);
      border-radius: 20px;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(180,140,70,0.2);
    }
    .profile-header {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 30px;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      background: linear-gradient(145deg, #3a2a1a, #1a1208);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid rgba(180,140,70,0.3);
    }
    .profile-avatar:hover { transform: scale(1.05); border-color: #d4a855; }
    
    .profile-info { flex: 1; }
    .profile-name {
      font-size: 28px;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .edit-icon {
      font-size: 16px;
      cursor: pointer;
      color: rgba(180,140,70,0.5);
      transition: color 0.2s;
    }
    .edit-icon:hover { color: #d4a855; }
    .profile-join {
      font-size: 10px;
      color: rgba(180,140,70,0.4);
      margin-bottom: 12px;
    }
    .profile-bio {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(180,140,70,0.7);
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 12px;
    }
    
    /* 統計 */
    .profile-stats {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
      margin: 30px 0;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
    }
    .stat-item { text-align: center; }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #d4a855;
    }
    .stat-label {
      font-size: 10px;
      color: rgba(180,140,70,0.5);
      margin-top: 5px;
    }
    
    /* タブ */
    .profile-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(180,140,70,0.2);
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 20px;
      color: rgba(180,140,70,0.5);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #d4a855; }
    .tab-btn.active {
      color: #d4a855;
      border-bottom: 2px solid #d4a855;
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* 作品一覧 */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .work-card {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
    }
    .work-card:hover { transform: translateY(-5px); background: rgba(0,0,0,0.4); }
    .work-cover {
      width: 100%;
      height: 180px;
      background: #2a1f0e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 10px;
    }
    .work-title {
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .work-stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 9px;
      color: rgba(180,140,70,0.4);
      margin-top: 6px;
    }
    
    /* アクティビティ */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .activity-item {
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .activity-icon { font-size: 24px; }
    .activity-content { flex: 1; }
    .activity-text { font-size: 12px; }
    .activity-date { font-size: 9px; color: rgba(180,140,70,0.4); margin-top: 4px; }
    
    /* バッジ */
    .badges-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 20px;
    }
    .badge {
      text-align: center;
      width: 80px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .badge:hover { transform: scale(1.05); }
    .badge-icon { font-size: 32px; margin-bottom: 8px; }
    .badge-name { font-size: 9px; }
    .badge.locked { opacity: 0.3; filter: grayscale(1); }
    
    /* フォローボタン */
    .follow-btn {
      background: rgba(180,140,70,0.2);
      border: 1px solid #d4a855;
      border-radius: 30px;
      padding: 8px 20px;
      color: #d4a855;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .follow-btn:hover { background: rgba(180,140,70,0.4); }
    .follow-btn.following { background: #d4a855; color: #1a1510; }
    
    .edit-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .edit-modal.open { opacity: 1; pointer-events: all; }
    .edit-modal-content {
      background: #231a0c;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
    }
    .edit-modal-content input, .edit-modal-content textarea {
      width: 100%;
      background: #2a2015;
      border: 1px solid rgba(180,140,70,0.3);
      border-radius: 8px;
      padding: 10px;
      color: #d4bc8a;
      margin: 10px 0;
    }
    .avatar-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .avatar-option {
      font-size: 30px;
      cursor: pointer;
      padding: 5px;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .avatar-option:hover { background: rgba(180,140,70,0.2); transform: scale(1.1); }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="shelf.html" class="nav-link">📚 本棚</a>
    <a href="atelier.html" class="nav-link">✒️ アトリエ</a>
    <a href="plaza.html" class="nav-link">🕊️ 広場</a>
    <a href="skins.html" class="nav-link">🎨 スキン</a>
    <a href="profile.html" class="nav-link active">👤 プロフィール</a>
  </nav>

  <div class="profile-bg" id="profileBg">
    <div class="profile-container">
      <!-- プロフィールカード -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar" id="avatar">📖</div>
          <div class="profile-info">
            <div class="profile-name">
              <span id="userName">名無しの書き手</span>
              <span class="edit-icon" id="editProfileBtn">✏️</span>
            </div>
            <div class="profile-join" id="joinDate">2024年1月1日から</div>
            <div class="profile-bio" id="userBio">本を書いたり読んだりしています。</div>
          </div>
        </div>
        
        <div class="profile-stats">
          <div class="stat-item"><div class="stat-value" id="bookCount">0</div><div class="stat-label">作品数</div></div>
          <div class="stat-item"><div class="stat-value" id="totalLikes">0</div><div class="stat-label">いいね</div></div>
          <div class="stat-item"><div class="stat-value" id="followerCount">0</div><div class="stat-label">フォロワー</div></div>
          <div class="stat-item"><div class="stat-value" id="followingCount">0</div><div class="stat-label">フォロー</div></div>
        </div>
        
        <div style="text-align: center;">
          <button class="follow-btn" id="followBtn" style="display: none;">フォロー</button>
        </div>
      </div>
      
      <!-- タブ -->
      <div class="profile-tabs">
        <button class="tab-btn active" data-tab="works">📚 作品</button>
        <button class="tab-btn" data-tab="activity">📋 アクティビティ</button>
        <button class="tab-btn" data-tab="badges">🏆 バッジ</button>
        <button class="tab-btn" data-tab="followers">👥 フォロワー</button>
      </div>
      
      <!-- 作品タブ -->
      <div class="tab-content active" id="worksTab">
        <div class="works-grid" id="worksGrid"></div>
      </div>
      
      <!-- アクティビティタブ -->
      <div class="tab-content" id="activityTab">
        <div class="activity-list" id="activityList"></div>
      </div>
      
      <!-- バッジタブ -->
      <div class="tab-content" id="badgesTab">
        <div class="badges-grid" id="badgesGrid"></div>
      </div>
      
      <!-- フォロワータブ -->
      <div class="tab-content" id="followersTab">
        <div class="activity-list" id="followersList"></div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="edit-modal" id="editModal">
    <div class="edit-modal-content">
      <h3>プロフィール編集</h3>
      <input type="text" id="editName" placeholder="名前">
      <textarea id="editBio" rows="3" placeholder="自己紹介"></textarea>
      <div class="avatar-options" id="avatarOptions">
        <div class="avatar-option">📖</div><div class="avatar-option">🎨</div><div class="avatar-option">✒️</div>
        <div class="avatar-option">📚</div><div class="avatar-option">🕊️</div><div class="avatar-option">⭐</div>
        <div class="avatar-option">🌙</div><div class="avatar-option">🌸</div><div class="avatar-option">🍁</div>
        <div class="avatar-option">❄️</div><div class="avatar-option">🐺</div><div class="avatar-option">🦊</div>
      </div>
      <button id="saveProfileBtn" style="background: #d4a855; color: #1a1510; border: none; padding: 10px; border-radius: 8px; margin-top: 10px; width: 100%;">保存</button>
      <button id="closeEditModal" style="background: transparent; border: 1px solid rgba(180,140,70,0.3); padding: 8px; border-radius: 8px; margin-top: 8px; width: 100%;">キャンセル</button>
    </div>
  </div>

  <script>
    // スキン適用
    const savedSkinCss = localStorage.getItem('profileSkinCss');
    if (savedSkinCss) document.getElementById('profileBg').style.cssText = savedSkinCss;
    
    let profile = JSON.parse(localStorage.getItem('profile') || '{"name":"名無しの書き手","bio":"本を書いたり読んだりしています。","avatar":"📖","joinDate":null}');
    let myBooks = [];
    let activities = JSON.parse(localStorage.getItem('activities') || '[]');
    let followers = JSON.parse(localStorage.getItem('followers') || '[]');
    let following = JSON.parse(localStorage.getItem('following') || '[]');
    let currentUserId = sessionStorage.getItem('userName') || '名無し';
    let isOwnProfile = true; // 自分のプロフィールかどうか
    
    // バッジ定義
    const allBadges = [
      { id: 'firstBook', name: 'はじめての本', icon: '📖', desc: '最初の本を出版' },
      { id: 'tenPages', name: '物語の始まり', icon: '📚', desc: '10ページ以上の本を作成' },
      { id: 'hundredLikes', name: '人気作家', icon: '❤️', desc: 'いいねを合計100獲得' },
      { id: 'masterPainter', name: '画伯', icon: '🎨', desc: '100回描画する' },
      { id: 'goldAuthor', name: '金賞作家', icon: '🏆', desc: 'いいねを合計500獲得' },
      { id: 'reviewer', name: 'レビュアー', icon: '✍️', desc: '10件レビューを書く' },
      { id: 'collector', name: '収集家', icon: '📦', desc: '20冊の本を読む' },
      { id: 'follower10', name: '人気者', icon: '👥', desc: 'フォロワー10人達成' }
    ];
    
    // 実績データを読み込み
    let achievements = JSON.parse(localStorage.getItem('achievements') || '{}');
    
    function loadProfile() {
      if (!profile.joinDate) {
        profile.joinDate = new Date().toISOString();
        localStorage.setItem('profile', JSON.stringify(profile));
      }
      document.getElementById('avatar').textContent = profile.avatar;
      document.getElementById('userName').textContent = profile.name;
      document.getElementById('userBio').textContent = profile.bio;
      document.getElementById('joinDate').textContent = `${new Date(profile.joinDate).getFullYear()}年${new Date(profile.joinDate).getMonth() + 1}月${new Date(profile.joinDate).getDate()}日から`;
      
      // 統計
      myBooks = JSON.parse(localStorage.getItem('myBooks') || '[]');
      const totalLikes = myBooks.reduce((sum, b) => sum + (b.likes || 0), 0);
      document.getElementById('bookCount').textContent = myBooks.length;
      document.getElementById('totalLikes').textContent = totalLikes;
      document.getElementById('followerCount').textContent = followers.length;
      document.getElementById('followingCount').textContent = following.length;
      
      // フォローボタン表示（自分のページでなければ）
      if (!isOwnProfile) {
        document.getElementById('followBtn').style.display = 'inline-block';
        const isFollowing = followers.includes(currentUserId);
        document.getElementById('followBtn').textContent = isFollowing ? 'フォロー中' : 'フォローする';
        document.getElementById('followBtn').classList.toggle('following', isFollowing);
      }
      
      renderWorks();
      renderActivities();
      renderBadges();
      renderFollowers();
    }
    
    function renderWorks() {
      const container = document.getElementById('worksGrid');
      if (myBooks.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:rgba(180,140,70,0.4);">まだ作品がありません</div>';
        return;
      }
      container.innerHTML = myBooks.map((book, idx) => `
        <div class="work-card" onclick="location.href='shelf.html?book=${book.id}'">
          <div class="work-cover" style="background: ${['#1a3a5c','#2d5a2d','#4a2d6b','#6b2d2d','#1a4a4a'][idx % 5]}">📖</div>
          <div class="work-title">${book.title.length > 12 ? book.title.slice(0,12)+'…' : book.title}</div>
          <div class="work-stats"><span>👁️ ${book.views || 0}</span><span>❤️ ${book.likes || 0}</span></div>
        </div>
      `).join('');
    }
    
    function renderActivities() {
      const container = document.getElementById('activityList');
      const sortedActivities = [...activities].sort((a,b) => b.timestamp - a.timestamp).slice(0, 20);
      if (sortedActivities.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:rgba(180,140,70,0.4);">まだアクティビティがありません</div>';
        return;
      }
      container.innerHTML = sortedActivities.map(act => `
        <div class="activity-item">
          <div class="activity-icon">${act.icon}</div>
          <div class="activity-content">
            <div class="activity-text">${act.text}</div>
            <div class="activity-date">${new Date(act.timestamp).toLocaleDateString()} ${new Date(act.timestamp).toLocaleTimeString()}</div>
          </div>
        </div>
      `).join('');
    }
    
    function renderBadges() {
      const container = document.getElementById('badgesGrid');
      const earnedBadges = allBadges.map(badge => ({
        ...badge,
        unlocked: achievements[badge.id]?.unlocked || false
      }));
      container.innerHTML = earnedBadges.map(badge => `
        <div class="badge ${!badge.unlocked ? 'locked' : ''}">
          <div class="badge-icon">${badge.unlocked ? badge.icon : '🔒'}</div>
          <div class="badge-name">${badge.name}</div>
        </div>
      `).join('');
    }
    
    function renderFollowers() {
      const container = document.getElementById('followersList');
      if (followers.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:rgba(180,140,70,0.4);">まだフォロワーはいません</div>';
        return;
      }
      container.innerHTML = followers.map(f => `
        <div class="activity-item">
          <div class="activity-icon">👤</div>
          <div class="activity-content">
            <div class="activity-text">${f}</div>
          </div>
        </div>
      `).join('');
    }
    
    // アクティビティ追加
    function addActivity(icon, text) {
      activities.unshift({ icon, text, timestamp: Date.now() });
      if (activities.length > 100) activities = activities.slice(0, 100);
      localStorage.setItem('activities', JSON.stringify(activities));
    }
    
    // フォロー機能
    document.getElementById('followBtn')?.addEventListener('click', () => {
      const isFollowing = followers.includes(currentUserId);
      if (isFollowing) {
        const index = followers.indexOf(currentUserId);
        followers.splice(index, 1);
        addActivity('👥', `${currentUserId} がフォローを解除しました`);
      } else {
        followers.push(currentUserId);
        addActivity('👥', `${currentUserId} にフォローされました`);
      }
      localStorage.setItem('followers', JSON.stringify(followers));
      loadProfile();
    });
    
    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(`${btn.dataset.tab}Tab`).classList.add('active');
      });
    });
    
    // 編集モーダル
    const editModal = document.getElementById('editModal');
    document.getElementById('editProfileBtn').addEventListener('click', () => {
      document.getElementById('editName').value = profile.name;
      document.getElementById('editBio').value = profile.bio;
      editModal.classList.add('open');
    });
    
    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      const newName = document.getElementById('editName').value.trim();
      const newBio = document.getElementById('editBio').value.trim();
      const selectedAvatar = document.querySelector('.avatar-option.selected')?.textContent || profile.avatar;
      if (newName) profile.name = newName;
      if (newBio) profile.bio = newBio;
      profile.avatar = selectedAvatar;
      localStorage.setItem('profile', JSON.stringify(profile));
      editModal.classList.remove('open');
      loadProfile();
      addActivity('✏️', 'プロフィールを更新しました');
    });
    
    document.getElementById('closeEditModal').addEventListener('click', () => {
      editModal.classList.remove('open');
    });
    
    // アバター選択
    document.querySelectorAll('.avatar-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });
    
    // 初期化
    loadProfile();
  </script>
</body>
</html>
