<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界を知る — スキン管理・実績・バッジ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Serif JP', serif; background: #1a1510; color: #d4bc8a; min-height: 100vh; }
    
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #1e140a;
      border-bottom: 1px solid rgba(180,140,70,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      z-index: 100;
    }
    .nav-link {
      color: rgba(180,140,70,0.45);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.15em;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: #d4a855; }
    
    .skins-container {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      padding: 30px;
    }
    
    /* タブ */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(180,140,70,0.2);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 24px;
      color: rgba(180,140,70,0.5);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      border-radius: 30px;
    }
    .tab-btn:hover { color: #d4a855; background: rgba(180,140,70,0.1); }
    .tab-btn.active { color: #d4a855; background: rgba(180,140,70,0.15); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* プレビューエリア */
    .preview-area {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .preview-card {
      width: 200px;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }
    .preview-card h3 { font-size: 12px; margin-bottom: 10px; letter-spacing: 0.1em; }
    .preview-box {
      height: 120px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .preview-atelier { background: #15100a; }
    .preview-shelf { background: #1a120a; }
    .preview-plaza { background: linear-gradient(180deg, #0a0a15, #12102a); }
    
    /* スキングリッド */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }
    .skin-card {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      position: relative;
    }
    .skin-card:hover { transform: translateY(-3px); background: rgba(0,0,0,0.5); }
    .skin-card.selected { border-color: #d4a855; background: rgba(180,140,70,0.15); }
    .skin-card.locked { opacity: 0.5; cursor: not-allowed; }
    .skin-card.locked:hover { transform: none; }
    .skin-icon { font-size: 40px; text-align: center; margin-bottom: 10px; }
    .skin-name { font-size: 12px; text-align: center; margin-bottom: 5px; }
    .skin-desc { font-size: 9px; text-align: center; color: rgba(180,140,70,0.5); }
    .lock-icon { position: absolute; top: 8px; right: 8px; font-size: 14px; }
    
    /* バッジグリッド */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
    }
    .badge-card {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s;
    }
    .badge-card:hover { transform: translateY(-3px); }
    .badge-card.locked { opacity: 0.4; filter: grayscale(0.5); }
    .badge-icon { font-size: 48px; margin-bottom: 10px; }
    .badge-name { font-size: 11px; margin-bottom: 5px; }
    .badge-desc { font-size: 8px; color: rgba(180,140,70,0.5); }
    
    /* 実績グリッド */
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .achievement-card {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .achievement-card.locked { opacity: 0.5; }
    .achievement-icon { font-size: 32px; width: 50px; text-align: center; }
    .achievement-info { flex: 1; }
    .achievement-name { font-size: 12px; margin-bottom: 4px; }
    .achievement-desc { font-size: 9px; color: rgba(180,140,70,0.5); }
    .achievement-reward { font-size: 9px; color: #d4a855; margin-top: 5px; }
    .progress-bar {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      height: 6px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      background: #d4a855;
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s;
    }
    
    /* 統計エリア */
    .stats-area {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 18px 25px;
      text-align: center;
      flex: 1;
      min-width: 100px;
    }
    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #d4a855;
    }
    .stat-label { font-size: 10px; margin-top: 5px; color: rgba(180,140,70,0.5); }
    
    /* テーマイベント */
    .event-banner {
      background: linear-gradient(135deg, rgba(180,80,80,0.3), rgba(80,80,180,0.3));
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: center;
      border: 1px solid rgba(180,140,70,0.3);
    }
    .event-title { font-size: 18px; margin-bottom: 8px; }
    .event-desc { font-size: 11px; color: rgba(180,140,70,0.6); }
    .event-timer { font-size: 24px; margin-top: 10px; color: #d4a855; }
    
    .apply-btn {
      background: rgba(180,140,70,0.2);
      border: 1px solid #d4a855;
      border-radius: 40px;
      padding: 14px 40px;
      color: #d4a855;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
      margin: 30px auto 0;
    }
    .apply-btn:hover { background: rgba(180,140,70,0.4); transform: scale(1.02); }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="shelf.html" class="nav-link">📚 本棚</a>
    <a href="atelier.html" class="nav-link">✒️ アトリエ</a>
    <a href="plaza.html" class="nav-link">🕊️ 広場</a>
    <a href="skins.html" class="nav-link active">🎨 スキン</a>
    <a href="profile.html" class="nav-link">👤 プロフィール</a>
  </nav>

  <div class="skins-container">
    <!-- タブ -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="skins">🎨 スキン</button>
      <button class="tab-btn" data-tab="badges">🏆 バッジ</button>
      <button class="tab-btn" data-tab="achievements">📜 実績</button>
      <button class="tab-btn" data-tab="events">🎪 イベント</button>
    </div>

    <!-- プレビュー（全タブ共通） -->
    <div class="preview-area">
      <div class="preview-card"><h3>✒️ アトリエ</h3><div class="preview-box preview-atelier" id="previewAtelier">🎨</div><div id="previewAtelierName">デフォルト</div></div>
      <div class="preview-card"><h3>📚 本棚</h3><div class="preview-box preview-shelf" id="previewShelf">📖</div><div id="previewShelfName">デフォルト</div></div>
      <div class="preview-card"><h3>🕊️ 広場</h3><div class="preview-box preview-plaza" id="previewPlaza">⭐</div><div id="previewPlazaName">デフォルト</div></div>
    </div>

    <!-- スキンタブ -->
    <div class="tab-content active" id="skinsTab">
      <div class="stats-area">
        <div class="stat-card"><div class="stat-number" id="totalBooks">0</div><div class="stat-label">作成した本</div></div>
        <div class="stat-card"><div class="stat-number" id="totalLikes">0</div><div class="stat-label">もらったいいね</div></div>
        <div class="stat-card"><div class="stat-number" id="totalPages">0</div><div class="stat-label">総ページ数</div></div>
        <div class="stat-card"><div class="stat-number" id="drawCount">0</div><div class="stat-label">描画回数</div></div>
      </div>
      
      <h3 style="margin: 20px 0 15px;">🎨 アトリエスキン</h3>
      <div class="skin-grid" id="atelierSkins"></div>
      
      <h3 style="margin: 30px 0 15px;">📚 本棚スキン</h3>
      <div class="skin-grid" id="shelfSkins"></div>
      
      <h3 style="margin: 30px 0 15px;">🕊️ 広場スキン</h3>
      <div class="skin-grid" id="plazaSkins"></div>
      
      <button class="apply-btn" id="applyBtn">✨ 選択したスキンを適用 ✨</button>
    </div>

    <!-- バッジタブ -->
    <div class="tab-content" id="badgesTab">
      <div class="badge-grid" id="badgesGrid"></div>
    </div>

    <!-- 実績タブ -->
    <div class="tab-content" id="achievementsTab">
      <div class="achievement-grid" id="achievementsGrid"></div>
    </div>

    <!-- イベントタブ -->
    <div class="tab-content" id="eventsTab">
      <div class="event-banner" id="eventBanner">
        <div class="event-title">🎄 クリスマスイベント 🎄</div>
        <div class="event-desc">期間限定スキン「雪の夜」をゲットしよう！</div>
        <div class="event-timer" id="eventTimer"></div>
      </div>
      <div class="skin-grid" id="eventSkins"></div>
    </div>
  </div>

  <script>
    // ===== スキンデータ =====
    const SKINS = {
      atelier: [
        { id: 1, name: 'デフォルト', icon: '🎨', css: 'background: #15100a;', requiredAch: null, desc: '最初から使える' },
        { id: 2, name: '夜の書庫', icon: '🌙', css: 'background: linear-gradient(135deg, #0a1628, #1a2a3a);', requiredAch: 'firstBook', desc: 'はじめての本 解除で解放' },
        { id: 3, name: '深紅の間', icon: '🔴', css: 'background: linear-gradient(135deg, #1a0a0a, #2a1a1a);', requiredAch: 'hundredLikes', desc: '人気作家 解除で解放' },
        { id: 4, name: '翡翠の書庫', icon: '💚', css: 'background: linear-gradient(135deg, #0a1a0a, #1a2a1a);', requiredAch: 'tenPages', desc: '物語の始まり 解除で解放' },
        { id: 5, name: '紫苑の間', icon: '🟣', css: 'background: radial-gradient(circle at 20% 30%, #2a1a3a, #0a0a1a);', requiredAch: 'masterPainter', desc: '画伯 解除で解放' },
        { id: 6, name: '黄金の間', icon: '🌟', css: 'background: linear-gradient(135deg, #2a1a0a, #3a2a1a);', requiredAch: 'goldAuthor', desc: '金賞作家 解除で解放' },
        { id: 7, name: '雪の夜', icon: '❄️', css: 'background: linear-gradient(135deg, #1a2a3a, #2a3a4a), radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1), transparent);', requiredAch: 'christmas2024', desc: 'クリスマスイベント限定❄️' }
      ],
      shelf: [
        { id: 1, name: 'デフォルト', icon: '📚', css: 'background: #1a120a;', requiredAch: null, desc: '最初から使える' },
        { id: 2, name: 'オーク材', icon: '🪵', css: 'background: linear-gradient(145deg, #2a1a0a, #1a0e05);', requiredAch: 'firstBook', desc: 'はじめての本 解除で解放' },
        { id: 3, name: 'マホガニー', icon: '🪵', css: 'background: linear-gradient(145deg, #3a1a0a, #2a0e05);', requiredAch: 'tenPages', desc: '物語の始まり 解除で解放' },
        { id: 4, name: 'ホワイト', icon: '⬜', css: 'background: #1a1a1a;', requiredAch: 'hundredLikes', desc: '人気作家 解除で解放' },
        { id: 5, name: 'ナイトムーン', icon: '🌙', css: 'background: linear-gradient(145deg, #0a0a2a, #050520);', requiredAch: 'masterPainter', desc: '画伯 解除で解放' },
        { id: 6, name: 'クリスマス', icon: '🎄', css: 'background: linear-gradient(145deg, #1a2a1a, #0a1a0a), radial-gradient(circle at 80% 20%, rgba(255,200,100,0.2), transparent);', requiredAch: 'christmas2024', desc: 'クリスマスイベント限定🎄' }
      ],
      plaza: [
        { id: 1, name: 'デフォルト', icon: '✨', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(80,60,100,0.15) 0%, transparent 70%), linear-gradient(180deg, #0a0a15 0%, #12102a 100%);', requiredAch: null, desc: '最初から使える' },
        { id: 2, name: '星空', icon: '⭐', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(100,80,120,0.2) 0%, transparent 70%), linear-gradient(180deg, #050520 0%, #0a0a30 100%);', requiredAch: 'firstBook', desc: 'はじめての本 解除で解放' },
        { id: 3, name: '桜', icon: '🌸', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(200,100,120,0.15) 0%, transparent 70%), linear-gradient(180deg, #2a0a15 0%, #1a0510 100%);', requiredAch: 'tenPages', desc: '物語の始まり 解除で解放' },
        { id: 4, name: '紅葉', icon: '🍁', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(200,80,40,0.15) 0%, transparent 70%), linear-gradient(180deg, #2a1505 0%, #1a0a00 100%);', requiredAch: 'hundredLikes', desc: '人気作家 解除で解放' },
        { id: 5, name: '雪', icon: '❄️', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(150,180,200,0.15) 0%, transparent 70%), linear-gradient(180deg, #15202a 0%, #0a1015 100%);', requiredAch: 'masterPainter', desc: '画伯 解除で解放' },
        { id: 6, name: '幻想的', icon: '🦄', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(150,80,180,0.2) 0%, transparent 70%), linear-gradient(180deg, #1a0a2a 0%, #0a0515 100%);', requiredAch: 'goldAuthor', desc: '金賞作家 解除で解放' },
        { id: 7, name: 'クリスマスナイト', icon: '🎄', css: 'background: radial-gradient(ellipse at 50% 40%, rgba(200,100,50,0.15) 0%, transparent 70%), linear-gradient(180deg, #1a2a1a 0%, #0a1a0a 100%);', requiredAch: 'christmas2024', desc: 'クリスマスイベント限定🎄' }
      ]
    };

    // バッジデータ
    const BADGES = [
      { id: 'firstBook', name: 'はじめての本', icon: '📖', desc: '最初の本を出版' },
      { id: 'tenPages', name: '物語の始まり', icon: '📚', desc: '10ページ以上の本を作成' },
      { id: 'hundredLikes', name: '人気作家', icon: '❤️', desc: 'いいねを合計100獲得' },
      { id: 'masterPainter', name: '画伯', icon: '🎨', desc: '100回描画する' },
      { id: 'goldAuthor', name: '金賞作家', icon: '🏆', desc: 'いいねを合計500獲得' },
      { id: 'reviewer', name: 'レビュアー', icon: '✍️', desc: '10件レビューを書く' },
      { id: 'collector', name: '収集家', icon: '📦', desc: '20冊の本を読む' },
      { id: 'follower10', name: '人気者', icon: '👥', desc: 'フォロワー10人達成' },
      { id: 'christmas2024', name: 'クリスマス', icon: '🎄', desc: 'クリスマスイベント参加' }
    ];

    // 実績データ
    let achievements = {
      firstBook: { name: 'はじめての本', desc: '最初の本を出版', icon: '📖', unlocked: false, reward: '夜の書庫,オーク材,星空', progress: { current: 0, max: 1 } },
      tenPages: { name: '物語の始まり', desc: '10ページ以上の本を作成', icon: '📚', unlocked: false, reward: '翡翠の書庫,マホガニー,桜', progress: { current: 0, max: 10 } },
      hundredLikes: { name: '人気作家', desc: 'いいねを合計100獲得', icon: '❤️', unlocked: false, reward: '深紅の間,ホワイト,紅葉', progress: { current: 0, max: 100 } },
      masterPainter: { name: '画伯', desc: '100回描画する', icon: '🎨', unlocked: false, reward: '紫苑の間,ナイトムーン,雪', progress: { current: 0, max: 100 } },
      goldAuthor: { name: '金賞作家', desc: 'いいねを合計500獲得', icon: '🏆', unlocked: false, reward: '黄金の間,幻想的', progress: { current: 0, max: 500 } },
      reviewer: { name: 'レビュアー', desc: '10件レビューを書く', icon: '✍️', unlocked: false, reward: '', progress: { current: 0, max: 10 } },
      collector: { name: '収集家', desc: '20冊の本を読む', icon: '📦', unlocked: false, reward: '', progress: { current: 0, max: 20 } },
      follower10: { name: '人気者', desc: 'フォロワー10人達成', icon: '👥', unlocked: false, reward: '', progress: { current: 0, max: 10 } }
    };

    let stats = { totalBooks: 0, totalLikes: 0, totalPages: 0, drawCount: 0 };
    let selectedSkins = { atelier: 1, shelf: 1, plaza: 1 };
    let eventEndTime = new Date('2024-12-26 00:00:00').getTime();

    // データ読み込み
    function loadData() {
      const savedAchievements = localStorage.getItem('achievements');
      if (savedAchievements) {
        const saved = JSON.parse(savedAchievements);
        Object.keys(saved).forEach(key => {
          if (achievements[key]) achievements[key].unlocked = saved[key].unlocked;
          if (achievements[key]?.progress && saved[key]?.progress) {
            achievements[key].progress.current = saved[key].progress.current;
          }
        });
      }
      
      const savedSkins = localStorage.getItem('selectedSkins');
      if (savedSkins) selectedSkins = JSON.parse(savedSkins);
      
      const myBooks = JSON.parse(localStorage.getItem('myBooks') || '[]');
      stats.totalBooks = myBooks.length;
      stats.totalLikes = myBooks.reduce((sum, b) => sum + (b.likes || 0), 0);
      stats.totalPages = myBooks.reduce((sum, b) => sum + (b.pages?.length || 0), 0);
      
      const savedStats = localStorage.getItem('stats');
      if (savedStats) stats.drawCount = JSON.parse(savedStats).drawCount || 0;
      
      // 実績チェックと進捗更新
      achievements.firstBook.progress.current = stats.totalBooks;
      achievements.tenPages.progress.current = stats.totalPages;
      achievements.hundredLikes.progress.current = stats.totalLikes;
      achievements.goldAuthor.progress.current = stats.totalLikes;
      achievements.masterPainter.progress.current = stats.drawCount;
      
      if (!achievements.firstBook.unlocked && stats.totalBooks >= 1) achievements.firstBook.unlocked = true;
      if (!achievements.tenPages.unlocked && stats.totalPages >= 10) achievements.tenPages.unlocked = true;
      if (!achievements.hundredLikes.unlocked && stats.totalLikes >= 100) achievements.hundredLikes.unlocked = true;
      if (!achievements.masterPainter.unlocked && stats.drawCount >= 100) achievements.masterPainter.unlocked = true;
      if (!achievements.goldAuthor.unlocked && stats.totalLikes >= 500) achievements.goldAuthor.unlocked = true;
      
      // レビュー数チェック
      const reviews = JSON.parse(localStorage.getItem('plazaReviews') || '{}');
      let reviewCount = 0;
      Object.values(reviews).forEach(arr => reviewCount += arr.length);
      achievements.reviewer.progress.current = reviewCount;
      if (!achievements.reviewer.unlocked && reviewCount >= 10) achievements.reviewer.unlocked = true;
      
      // フォロワーチェック
      const followers = JSON.parse(localStorage.getItem('followers') || '[]');
      achievements.follower10.progress.current = followers.length;
      if (!achievements.follower10.unlocked && followers.length >= 10) achievements.follower10.unlocked = true;
      
      localStorage.setItem('achievements', JSON.stringify(achievements));
      
      updateStatsDisplay();
      renderSkins();
      renderBadges();
      renderAchievements();
      renderEventSkins();
      updatePreview();
      startEventTimer();
    }

    function updateStatsDisplay() {
      document.getElementById('totalBooks').textContent = stats.totalBooks;
      document.getElementById('totalLikes').textContent = stats.totalLikes;
      document.getElementById('totalPages').textContent = stats.totalPages;
      document.getElementById('drawCount').textContent = stats.drawCount;
    }

    function renderSkins() {
      renderSkinGrid('atelierSkins', SKINS.atelier, 'atelier');
      renderSkinGrid('shelfSkins', SKINS.shelf, 'shelf');
      renderSkinGrid('plazaSkins', SKINS.plaza, 'plaza');
    }

    function renderSkinGrid(containerId, skins, type) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = skins.map(skin => {
        const isUnlocked = !skin.requiredAch || achievements[skin.requiredAch]?.unlocked;
        const isSelected = selectedSkins[type] === skin.id;
        return `<div class="skin-card ${!isUnlocked ? 'locked' : ''} ${isSelected ? 'selected' : ''}" data-type="${type}" data-id="${skin.id}">${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}<div class="skin-icon">${skin.icon}</div><div class="skin-name">${skin.name}</div><div class="skin-desc">${skin.desc}</div></div>`;
      }).join('');
      
      container.querySelectorAll('.skin-card:not(.locked)').forEach(card => {
        card.addEventListener('click', () => {
          const type = card.dataset.type;
          const id = parseInt(card.dataset.id);
          selectedSkins[type] = id;
          localStorage.setItem('selectedSkins', JSON.stringify(selectedSkins));
          renderSkins();
          updatePreview();
        });
      });
    }

    function renderBadges() {
      const container = document.getElementById('badgesGrid');
      if (!container) return;
      container.innerHTML = BADGES.map(badge => {
        const unlocked = achievements[badge.id]?.unlocked || false;
        return `<div class="badge-card ${!unlocked ? 'locked' : ''}"><div class="badge-icon">${unlocked ? badge.icon : '🔒'}</div><div class="badge-name">${badge.name}</div><div class="badge-desc">${badge.desc}</div></div>`;
      }).join('');
    }

    function renderAchievements() {
      const container = document.getElementById('achievementsGrid');
      if (!container) return;
      container.innerHTML = Object.entries(achievements).map(([key, ach]) => {
        const percent = (ach.progress.current / ach.progress.max) * 100;
        return `<div class="achievement-card ${ach.unlocked ? '' : 'locked'}"><div class="achievement-icon">${ach.unlocked ? ach.icon : '🔒'}</div><div class="achievement-info"><div class="achievement-name">${ach.name}</div><div class="achievement-desc">${ach.desc}</div><div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div><div class="achievement-reward">${ach.reward ? '🎁 ' + ach.reward : ''}</div></div></div>`;
      }).join('');
    }

    function renderEventSkins() {
      const container = document.getElementById('eventSkins');
      if (!container) return;
      const eventSkins = [
        { id: 8, name: '雪の夜', icon: '❄️', type: 'atelier', desc: 'クリスマス限定❄️' },
        { id: 7, name: 'クリスマス', icon: '🎄', type: 'shelf', desc: 'クリスマス限定🎄' },
        { id: 8, name: 'クリスマスナイト', icon: '🎄', type: 'plaza', desc: 'クリスマス限定🎄' }
      ];
      container.innerHTML = eventSkins.map(skin => `<div class="skin-card" style="cursor: default;"><div class="skin-icon">${skin.icon}</div><div class="skin-name">${skin.name}</div><div class="skin-desc">${skin.desc}</div></div>`).join('');
    }

    function updatePreview() {
      const atelierSkin = SKINS.atelier.find(s => s.id === selectedSkins.atelier);
      const shelfSkin = SKINS.shelf.find(s => s.id === selectedSkins.shelf);
      const plazaSkin = SKINS.plaza.find(s => s.id === selectedSkins.plaza);
      document.getElementById('previewAtelier').style.cssText = atelierSkin?.css || '';
      document.getElementById('previewAtelierName').textContent = atelierSkin?.name || 'デフォルト';
      document.getElementById('previewShelf').style.cssText = shelfSkin?.css || '';
      document.getElementById('previewShelfName').textContent = shelfSkin?.name || 'デフォルト';
      document.getElementById('previewPlaza').style.cssText = plazaSkin?.css || '';
      document.getElementById('previewPlazaName').textContent = plazaSkin?.name || 'デフォルト';
    }

    function applySkins() {
      const atelierSkin = SKINS.atelier.find(s => s.id === selectedSkins.atelier);
      const shelfSkin = SKINS.shelf.find(s => s.id === selectedSkins.shelf);
      const plazaSkin = SKINS.plaza.find(s => s.id === selectedSkins.plaza);
      localStorage.setItem('atelierSkin', selectedSkins.atelier);
      localStorage.setItem('shelfSkin', selectedSkins.shelf);
      localStorage.setItem('plazaSkin', selectedSkins.plaza);
      localStorage.setItem('atelierSkinCss', atelierSkin?.css || '');
      localStorage.setItem('shelfSkinCss', shelfSkin?.css || '');
      localStorage.setItem('plazaSkinCss', plazaSkin?.css || '');
      alert(`✨ スキンを適用しました！\n\nアトリエ: ${atelierSkin?.name}\n本棚: ${shelfSkin?.name}\n広場: ${plazaSkin?.name}`);
    }

    function startEventTimer() {
      const timer = setInterval(() => {
        const now = Date.now();
        const diff = eventEndTime - now;
        if (diff <= 0) {
          document.getElementById('eventTimer').textContent = '🎉 イベント終了 🎉';
          clearInterval(timer);
        } else {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (86400000)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (3600000)) / (1000 * 60));
          document.getElementById('eventTimer').textContent = `残り ${days}日 ${hours}時間 ${minutes}分`;
        }
      }, 1000);
    }

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(`${btn.dataset.tab}Tab`).classList.add('active');
      });
    });

    document.getElementById('applyBtn').addEventListener('click', applySkins);

    loadData();
  </script>
</body>
</html>
